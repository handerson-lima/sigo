name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Functions npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  doc-check:
    name: Doc check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-docs.py --self-test

  no-secrets:
    name: Credenciais fora do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Falha se arquivo de credencial estiver rastreado
        run: |
          set -euo pipefail
          suspeitos=$(git ls-files | grep -Ei '(^|/)[^/]*serviceAccountKey[^/]*\.json$|(^|/)[^/]*service-account[^/]*\.json$|(^|/)[^/]*firebase-adminsdk[^/]*\.json$|\.pem$|\.key$|\.cert$|\.p12$|(^|/)[^/]*\.env$|(^|/)[^/]*\.env\.[^/]+$' | grep -v '\.env\.example$' || true)
          if [ -n "$suspeitos" ]; then
            echo "Falha: arquivos de credencial rastreados pelo git:"
            echo "$suspeitos"
            exit 1
          fi
          echo "OK: nenhum arquivo de credencial rastreado."
